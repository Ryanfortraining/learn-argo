## ArgoCD Configuration for EKS
## Linus says: Simplicity is the ultimate sophistication.
## This file passes values to the argo-cd subchart.

argo-cd:
  ## Global Configuration
  global:
    domain: argocd.local

  ## ArgoCD Server Configuration
  server:
    # Disable TLS for HTTP access (练习环境)
    extraArgs:
      - --insecure

    service:
      type: LoadBalancer
      annotations:
        # Use AWS Network Load Balancer for better performance
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        # Internet-facing for external access
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
